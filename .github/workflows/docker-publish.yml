name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '43 11 * * *'
  push:
    # Trigger on tags following proper Semantic Versioning
    # Examples of valid tags:
    #   v1.0.0           -> stable release
    #   v1.2.3-rc.1      -> release candidate
    #   v0.1.0-beta.2    -> beta version
    # Invalid tags (will fail Helm packaging):
    #   test-v1.0.0      -> Helm does not accept "test-" prefix
    #   version1.0.0     -> must start with 'v' followed by SemVer
    tags:
      - 'v*.*.*'        # matches stable versions like v0.0.1, v1.2.3
      - 'v*.*.*-*'      # matches prerelease versions like v1.0.0-rc.1

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5e0 # v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a141130b2 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push only a quarantine tag. Final release tags are created
      # after the image vulnerability gate passes.
      # https://github.com/docker/build-push-action
      - name: Build quarantine Docker image
        id: build-quarantine
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            PROJECT=github.com/americancode/adcs-issuer
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Set up Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan quarantine image
        if: github.event_name != 'pull_request'
        env:
          QUARANTINE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            "${QUARANTINE_IMAGE}"

      - name: Promote scanned image to release tags
        if: github.event_name != 'pull_request'
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
          QUARANTINE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          while IFS= read -r final_tag; do
            if [[ -n "${final_tag}" ]]; then
              docker buildx imagetools create --tag "${final_tag}" "${QUARANTINE_IMAGE}"
            fi
          done <<< "${FINAL_TAGS}"

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-quarantine.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve Helm dependencies
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          helm dependency build charts/adcs-issuer

      - name: Enable OCI support
        run: helm registry login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to GHCR
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          NAMESPACE: ${{ github.repository_owner }}
        run: |
          helm package charts/adcs-issuer --version ${DOCKER_METADATA_OUTPUT_VERSION} --app-version ${DOCKER_METADATA_OUTPUT_VERSION}
          CHART_NAME=$(awk '$1 == "name:" { print $2; exit }' charts/adcs-issuer/Chart.yaml)
          helm push ${CHART_NAME}-${DOCKER_METADATA_OUTPUT_VERSION}.tgz oci://ghcr.io/${NAMESPACE}/helm-charts
