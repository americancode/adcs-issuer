name: Docker

on:
  push:
    # Accept both v1.2.3 and 1.2.3, including prereleases.
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
      - '*.*.*'
      - '*.*.*-*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Go and Helm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and enforce coverage
        run: make dpl=/dev/null coverage

      - name: Run vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve Helm dependencies
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          helm dependency build charts/adcs-issuer

      - name: Lint Helm chart
        run: helm lint charts/adcs-issuer

      - name: Render Helm chart
        run: helm template adcs-issuer charts/adcs-issuer >/dev/null

      - name: Verify Helm CRDs
        run: bash scripts/verify-helm-crds.sh

  build-amd64:
    name: Build and scan amd64 quarantine image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 quarantine image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            PROJECT=github.com/americancode/adcs-issuer
          cache-from: type=gha,scope=adcs-issuer-amd64
          cache-to: type=gha,mode=max,scope=adcs-issuer-amd64
          provenance: mode=max
          sbom: true

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan amd64 quarantine image
        id: scan
        env:
          QUARANTINE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-amd64
        run: |
          trivy image \
            --image-src remote \
            --platform linux/amd64 \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --pkg-types os,library \
            --format json \
            --output "${RUNNER_TEMP}/trivy-image-amd64.json" \
            --exit-code 0 \
            "${QUARANTINE_IMAGE}"
          trivy convert --format sarif \
            --output "${RUNNER_TEMP}/trivy-image-amd64.sarif" \
            "${RUNNER_TEMP}/trivy-image-amd64.json"
          echo "sarif=true" >> "${GITHUB_OUTPUT}"

      - name: Upload amd64 image scan SARIF
        if: ${{ always() && steps.scan.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image-amd64.sarif
          category: trivy-image-amd64

      - name: Enforce amd64 image vulnerability gate
        env:
          TRIVY_IMAGE_JSON: ${{ runner.temp }}/trivy-image-amd64.json
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${TRIVY_IMAGE_JSON}")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${TRIVY_IMAGE_JSON}")"
          echo "amd64 image vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high == 0 ))

  build-arm64:
    name: Build and scan arm64 quarantine image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 quarantine image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            PROJECT=github.com/americancode/adcs-issuer
          cache-from: type=gha,scope=adcs-issuer-arm64
          cache-to: type=gha,mode=max,scope=adcs-issuer-arm64
          provenance: mode=max
          sbom: true

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan arm64 quarantine image
        id: scan
        env:
          QUARANTINE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          trivy image \
            --image-src remote \
            --platform linux/arm64 \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --pkg-types os,library \
            --format json \
            --output "${RUNNER_TEMP}/trivy-image-arm64.json" \
            --exit-code 0 \
            "${QUARANTINE_IMAGE}"
          trivy convert --format sarif \
            --output "${RUNNER_TEMP}/trivy-image-arm64.sarif" \
            "${RUNNER_TEMP}/trivy-image-arm64.json"
          echo "sarif=true" >> "${GITHUB_OUTPUT}"

      - name: Upload arm64 image scan SARIF
        if: ${{ always() && steps.scan.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image-arm64.sarif
          category: trivy-image-arm64

      - name: Enforce arm64 image vulnerability gate
        env:
          TRIVY_IMAGE_JSON: ${{ runner.temp }}/trivy-image-arm64.json
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${TRIVY_IMAGE_JSON}")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${TRIVY_IMAGE_JSON}")"
          echo "arm64 image vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high == 0 ))

  publish:
    name: Promote image and publish chart
    runs-on: ubuntu-latest
    needs: [validate, build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Promote scanned images to the release manifest
        id: promote
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be pure semver with an optional v prefix: ${REF_NAME}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '/^Digest:/ { print $2; exit }')"
          test -n "${digest}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign promoted image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.promote.outputs.version }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: cosign sign --yes "${IMAGE}:${VERSION}@${DIGEST}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve Helm dependencies
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          helm dependency build charts/adcs-issuer

      - name: Push Helm chart to GHCR
        env:
          NAMESPACE: ${{ github.repository_owner }}
          VERSION: ${{ steps.promote.outputs.version }}
        run: |
          CHART_PACKAGE="$(helm package charts/adcs-issuer --version "${VERSION}" --app-version "${VERSION}" | sed -n 's/^Successfully packaged chart and saved it to: //p' | tr -d '\r')"
          test -n "${CHART_PACKAGE}"
          test -f "${CHART_PACKAGE}"
          helm push "${CHART_PACKAGE}" "oci://ghcr.io/${NAMESPACE}/helm-charts"
